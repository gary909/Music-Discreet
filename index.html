<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discreet Music Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- LEFT COLUMN: Synthesizers and Sequencers -->
        <div class="left-column">
            <div class="synths-row">
                <!-- Synth 1 Module -->
                <div class="panel synth-panel" id="synth1">
                    <h3>Synth 1</h3>
                    <div class="controls-grid">
                        <div class="control"><label>Wave</label><select id="s1-wave"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select></div>
                        <div class="control"><label>Attack</label><input type="range" id="s1-atk" min="0.01" max="5" step="0.01" value="0.5"></div>
                        <div class="control"><label>Decay</label><input type="range" id="s1-dec" min="0.01" max="5" step="0.01" value="2.0"></div>
                        <div class="control"><label>Cutoff</label><input type="range" id="s1-cut" min="20" max="10000" value="1000"></div>
                        <div class="control"><label>Res</label><input type="range" id="s1-res" min="0" max="20" value="2"></div>
                        <div class="control"><label>Trill</label><input type="range" id="s1-trill" min="0" max="100" value="0"></div>
                        <div class="control"><label>Trill Key</label><input type="checkbox" id="s1-trill-key"></div>
                        <div class="control"><label>MIDI Ch</label><select id="s1-midi">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select></div>
                    </div>
                    <!-- Synth 1 Preset Selector UI -->
                    <div class="preset-container">
                        <button id="synth1-preset-prev" class="preset-btn">&lt;</button>
                        <span id="synth1-preset-name" class="preset-name">Gentle Sine</span>
                        <button id="synth1-preset-next" class="preset-btn">&gt;</button>
                    </div>
                </div>

                <!-- Synth 2 Module -->
                <div class="panel synth-panel" id="synth2">
                    <h3>Synth 2</h3>
                    <div class="controls-grid">
                        <div class="control"><label>Wave</label><select id="s2-wave"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select></div>
                        <div class="control"><label>Attack</label><input type="range" id="s2-atk" min="0.01" max="5" step="0.01" value="1.0"></div>
                        <div class="control"><label>Decay</label><input type="range" id="s2-dec" min="0.01" max="5" step="0.01" value="3.0"></div>
                        <div class="control"><label>Cutoff</label><input type="range" id="s2-cut" min="20" max="10000" value="800"></div>
                        <div class="control"><label>Res</label><input type="range" id="s2-res" min="0" max="20" value="1"></div>
                        <div class="control"><label>Trill</label><input type="range" id="s2-trill" min="0" max="100" value="0"></div>
                        <div class="control"><label>Trill Key</label><input type="checkbox" id="s2-trill-key"></div>
                        <div class="control"><label>MIDI Ch</label><select id="s2-midi">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select></div>
                    </div>
                    <!-- Synth 2 Preset Selector UI -->
                    <div class="preset-container">
                        <button id="synth2-preset-prev" class="preset-btn">&lt;</button>
                        <span id="synth2-preset-name" class="preset-name">Deep Warmth</span>
                        <button id="synth2-preset-next" class="preset-btn">&gt;</button>
                    </div>
                </div>
            </div>

            <!-- Phasing Sequencers Area -->
            <div class="panel sequencer-panel">
                <div class="seq-header">
                    <h3>Sequencer 1 (Phasing Loop A)</h3>
                    <label>Length (Bars): 
                        <select id="seq1-length">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12" selected>12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                        </select>
                    </label>
                </div>
                <div class="piano-roll" id="roll1"></div>

                <div class="seq-header" style="margin-top: 20px;">
                    <h3>Sequencer 2 (Phasing Loop B)</h3>
                    <label>Length (Bars): 
                        <select id="seq2-length">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14" selected>14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                        </select>
                    </label>
                </div>
                <div class="piano-roll" id="roll2"></div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Signal Processing Chain & Transport Controls -->
        <div class="right-column">
            <!-- 10-Band EQ Unit -->
            <div class="panel eq-panel">
                <h3>10-Band EQ</h3>
                <div class="eq-sliders" id="eq-sliders">
                    <!-- Vertical Sliders dynamically injected via JS -->
                </div>
                <!-- EQ Preset Selector UI -->
                <div class="preset-container">
                    <button id="eq-preset-prev" class="preset-btn">&lt;</button>
                    <span id="eq-preset-name" class="preset-name">Flat</span>
                    <button id="eq-preset-next" class="preset-btn">&gt;</button>
                </div>
            </div>
            
            <div class="arrow-down">▼</div>

            <!-- Delay Module 1 -->
            <div class="panel delay-panel" id="delay1">
                <h3>Delay 1</h3>
                <div class="controls-grid single-row">
                    <div class="control knob-red"><label>Time</label><input type="range" class="delay-time" min="0" max="6" step="0.01" value="3.0"></div>
                    <div class="control knob-white"><label>Fback</label><input type="range" class="delay-fback" min="0" max="0.95" step="0.01" value="0.4"></div>
                    <div class="control knob-green"><label>Filter</label><input type="range" class="delay-filter" min="20" max="10000" value="2000"></div>
                    <div class="control knob-blue"><label>Mix</label><input type="range" class="delay-mix" min="0" max="1" step="0.01" value="0.3"></div>
                </div>
                <!-- Delay 1 Preset Selector UI -->
                <div class="preset-container">
                    <button id="delay1-preset-prev" class="preset-btn">&lt;</button>
                    <span id="delay1-preset-name" class="preset-name">Medium Echo (3s)</span>
                    <button id="delay1-preset-next" class="preset-btn">&gt;</button>
                </div>
            </div>

            <div class="arrow-down">▼</div>

            <!-- Delay Module 2 -->
            <div class="panel delay-panel" id="delay2">
                <h3>Delay 2</h3>
                <div class="controls-grid single-row">
                    <div class="control knob-red"><label>Time</label><input type="range" class="delay-time" min="0" max="6" step="0.01" value="6.0"></div>
                    <div class="control knob-white"><label>Fback</label><input type="range" class="delay-fback" min="0" max="0.95" step="0.01" value="0.6"></div>
                    <div class="control knob-green"><label>Filter</label><input type="range" class="delay-filter" min="20" max="10000" value="1500"></div>
                    <div class="control knob-blue"><label>Mix</label><input type="range" class="delay-mix" min="0" max="1" step="0.01" value="0.2"></div>
                </div>
                <!-- Delay 2 Preset Selector UI -->
                <div class="preset-container">
                    <button id="delay2-preset-prev" class="preset-btn">&lt;</button>
                    <span id="delay2-preset-name" class="preset-name">Long Drone (6s)</span>
                    <button id="delay2-preset-next" class="preset-btn">&gt;</button>
                </div>
            </div>

            <div class="arrow-down">▼</div>

            <!-- Master Reverb Module -->
            <div class="panel reverb-panel" id="reverb-module">
                <h3>Master Reverb</h3>
                <div class="controls-grid single-row">
                    <div class="control"><label>Time (s)</label><input type="range" id="rev-time" min="0.5" max="8.0" step="0.1" value="3.0"></div>
                    <div class="control"><label>Decay</label><input type="range" id="rev-decay" min="0.5" max="5.0" step="0.1" value="2.0"></div>
                    <div class="control"><label>S1 Send</label><input type="range" id="s1-rev-master" min="0" max="1" step="0.01" value="0.3"></div>
                    <div class="control"><label>S2 Send</label><input type="range" id="s2-rev-master" min="0" max="1" step="0.01" value="0.4"></div>
                </div>
            </div>

            <div class="arrow-down">▼</div>

            <!-- Transport & Synth Mix Panel -->
            <div class="panel transport-panel">
                <h3>Transport & Mix</h3>
                <div class="transport-main">
                    <button id="play-btn">Play / Pause</button>
                    <div class="tempo-control">
                        <label>Scale: 
                            <select id="scale-select">
                                <option value="pentatonic" selected>Pentatonic Major</option>
                                <option value="pentatonicMinor">Pentatonic Minor</option>
                                <option value="major">Major / Ionian</option>
                                <option value="minor">Natural Minor</option>
                                <option value="dorian">Dorian</option>
                                <option value="chromatic">Chromatic</option>
                            </select>
                        </label>
                        <label>Tempo (BPM): <input type="number" id="bpm-input" value="60"></label>
                    </div>
                </div>
                
                <div class="synth-mix-controls">
                    <div class="mix-group">
                        <h4>Synth 1</h4>
                        <div class="control-row">
                            <div class="control"><label>Vol</label><input type="range" id="s1-vol" min="0" max="1" step="0.01" value="0.8"></div>
                            <div class="control"><label>Pan</label><input type="range" id="s1-pan" min="-1" max="1" step="0.01" value="0"></div>
                        </div>
                    </div>
                    <div class="mix-group">
                        <h4>Synth 2</h4>
                        <div class="control-row">
                            <div class="control"><label>Vol</label><input type="range" id="s2-vol" min="0" max="1" step="0.01" value="0.8"></div>
                            <div class="control"><label>Pan</label><input type="range" id="s2-pan" min="-1" max="1" step="0.01" value="0"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
